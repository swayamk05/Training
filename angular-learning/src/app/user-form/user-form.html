<div class="container">

  <h2>User Form</h2>

  <form [formGroup]="userForm">

    <div class="form-group">
      <label>Name</label>

      <input
        type="text"
        formControlName="name"
        placeholder="Enter your name"
      />
    </div>

    <div class="form-group">
      <label>Email</label>

      <input
        type="email"
        formControlName="email"
        placeholder="Enter your email"
      />
    </div>

    <div class="buttons">

      <button
        type="button"
        [disabled]="userForm.invalid"
        (click)="save()">
        Save
      </button>

      <button
        type="button"
        [disabled]="userForm.invalid"
        (click)="sayHello()">
        Say Hello
      </button>

    </div>

  </form>

</div>
